<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="etc.css"><script src="etc.js"></script><title>ETC · ร้านแลกเหรียญ</title></head><body><main>
<h2>🛒 ร้านแลกเหรียญลับ</h2><p class="mut">ใช้เหรียญซื้อสีธีมของเว็บ (ใช้กับทุกหน้าที่ใช้ etc.css) · <a href="secret-treasure.html">ห้องสมบัติ</a></p><div id="sh"></div>
<script>
const I=[['ฟ้า','#0ea5e9',10],['เขียว','#16a34a',10],['ส้ม','#ea580c',20],['ชมพู','#db2777',20],['ทอง','#ca8a04',50]];
let own=[];try{own=JSON.parse(localStorage.getItem('etcown')||'[]')}catch(e){}
function setA(c){document.documentElement.style.setProperty('--pri',c);try{localStorage.setItem('etcaccent',c)}catch(e){}}
function buy(i){if(!own.includes(i)){if(!spendCoin(I[i][2])){alert('เหรียญไม่พอ');return}own.push(i);try{localStorage.setItem('etcown',JSON.stringify(own))}catch(e){}}setA(I[i][1]);draw()}
function reset(){setA('#4f46e5');draw()}
function draw(){document.getElementById('sh').innerHTML=I.map((x,i)=>'<div class="card" style="display:flex;justify-content:space-between;align-items:center"><span><span style="display:inline-block;width:22px;height:22px;border-radius:50%;background:'+x[1]+';vertical-align:middle"></span> สี'+x[0]+'</span><button onclick="buy('+i+')" style="padding:9px 16px;border:0;border-radius:10px;background:'+x[1]+';color:#fff;font-size:16px">'+(own.includes(i)?'ใช้สีนี้':'ซื้อ '+x[2]+' 🪙')+'</button></div>').join('')+'<button onclick="reset()" style="padding:9px 16px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-size:16px">↺ สีเริ่มต้น</button>'}
addEventListener('DOMContentLoaded',draw);
</script></main></body></html>
