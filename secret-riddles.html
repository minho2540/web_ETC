<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="etc.css"><script src="etc.js"></script><title>ETC · ห้องปริศนา</title></head><body><main>
<h2>🗝 ห้องปริศนาลับ</h2><p class="mut">ตอบถูกครั้งแรกได้ +5 🪙 ต่อข้อ · <a href="secret-treasure.html">ไปห้องสมบัติ</a> · <a href="labyrinth.html">กลับเขาวงกต</a></p><div id="rq"></div>
<script>
const R=[['อะไรเอ่ย ยิ่งเอาออกยิ่งใหญ่',['หลุม','ลูกโป่ง','ขนมปัง'],0],['มีเมืองไม่มีคน มีทะเลไม่มีน้ำ',['ลูกโลกจำลอง','แผนที่','ภาพวาด'],1],['อะไรเอ่ย ยิ่งล้างยิ่งสกปรก',['สบู่','ผ้าเช็ดตัว','น้ำ'],2],['มีสี่ขาแต่เดินไม่ได้',['โต๊ะ','แมว','ปู'],0],['ฟังได้แต่จับไม่ได้',['หนังสือ','เสียง','ก้อนหิน'],1]];
let sv=[];try{sv=JSON.parse(localStorage.getItem('etcriddles')||'[]')}catch(e){}
const rq=document.getElementById('rq');
rq.innerHTML=R.map((r,i)=>'<div class="card"><b>'+(i+1)+'. '+r[0]+(sv.includes(i)?' ✅':'')+'</b><br>'+r[1].map((o,j)=>'<button class="pad" style="margin:6px 6px 0 0;padding:10px 16px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-size:16px" onclick="ans('+i+','+j+',this)">'+o+'</button>').join('')+'<p class="mut" id="m'+i+'"></p></div>').join('');
function ans(i,j,b){const m=document.getElementById('m'+i);if(j!=R[i][2]){m.textContent='❌ ยังไม่ใช่ ลองใหม่';return}
 if(sv.includes(i)){m.textContent='✅ ถูกแล้ว (เคยรับเหรียญแล้ว)';return}
 sv.push(i);try{localStorage.setItem('etcriddles',JSON.stringify(sv))}catch(e){}addCoin(5);m.textContent='🎉 ถูกต้อง! +5 🪙'}
</script></main></body></html>
