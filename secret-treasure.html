<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="etc.css"><script src="etc.js"></script><title>ETC · ห้องสมบัติ</title></head><body><main style="text-align:center">
<h2>💎 ห้องสมบัติลับ</h2><div class="card"><b style="font-size:40px" id="tc"></b><br>เหรียญที่สะสมได้<p id="rk" style="font-size:20px"></p><p class="mut" id="nx"></p></div>
<div class="card"><b>วิธีหาเหรียญ</b><ul style="text-align:left"><li>กด 🚪 ประตูสุ่ม ได้ +1</li><li>ผ่านด่านเกมเขาวงกต ได้ +2 ต่อด่าน</li><li>หาทางออกใน <a href="labyrinth.html">เขาวงกตแห่งข้อมูล</a> ได้ +10</li><li>ตอบปริศนาใน <a href="secret-riddles.html">ห้องปริศนา</a> ได้ +5 ต่อข้อ</li><li>ใช้เหรียญซื้อสีธีมที่ <a href="secret-shop.html">ร้านลับ</a></li></ul></div>
<script>
const T=[[0,'นักเดินทางใหม่'],[10,'นักสำรวจ'],[30,'นักล่าขุมทรัพย์'],[80,'ผู้เชี่ยวชาญเขาวงกต'],[200,'ราชาแห่งเขาวงกต']];
addEventListener('DOMContentLoaded',()=>{const c=coins();let k=0;T.forEach((t,i)=>{if(c>=t[0])k=i});
document.getElementById('tc').textContent='🪙 '+c;document.getElementById('rk').textContent='ตำแหน่ง: '+T[k][1];
document.getElementById('nx').textContent=T[k+1]?'อีก '+(T[k+1][0]-c)+' เหรียญจะเป็น "'+T[k+1][1]+'"':'คุณถึงตำแหน่งสูงสุดแล้ว 👑'});
</script></main></body></html>
